version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: krev_mongodb
    ports:
      - "27017:27017"  # Map host port 27017 to container port 27017
    volumes:
      - mongodb_data:/data/db # Persist data using a named volume
    environment:
      #MONGO_INITDB_ROOT_USERNAME: admin
      #MONGO_INITDB_ROOT_PASSWORD: lifter13
      MONGO_INITDB_DATABASE: userdb
    restart: always # Ensure the container restarts if it crashes

# now it is optional since modern kafka can work w/o ZK
  zookeeper:
    image: confluentinc/cp-zookeeper:6.2.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000

  kafka:
    image: confluentinc/cp-kafka:7.0.0
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - ALLOW_PLAINTEXT_LISTENER=yes
#    depends_on:
#      - zookeeper

  user-service:
    build: 
      context: ./user_service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8080:8080" # expose the application port
      - "5005:5005" # expose debug port
    depends_on:
      - mongodb
      - kafka
    environment:
      - SPRING_DATA_MONGODB_HOST=mongodb
      - SPRING_DATA_MONGODB_PORT=27017
      - SPRING_DATA_MONGODB_DATABASE=userdb
      - NOTIFICATION_SERVICE_URL=http://notification-service:8081   # to send REST to notification-service
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  notification-service:
    build: 
      context: ./notification_service
      dockerfile: Dockerfile  
    container_name: notification_service
    ports:
      - "8081:8081" # expose the application port
    depends_on:
      - kafka
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092

volumes:
  mongodb_data: # Define the named volume for data persistence